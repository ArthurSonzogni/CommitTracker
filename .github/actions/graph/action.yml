name: 'Generate Graphs'
description: 'Installs OpenMP, builds C++ project, generates graphs, and pushes community map'
inputs:
  github_token:
    description: 'GitHub Token'
    required: true
  force:
    description: 'Regenerate every graph, even the up to date ones'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Install OpenMP
      shell: bash
      run: sudo apt-get install libomp-dev libomp5

    - name: Build the C++ project
      uses: threeal/cmake-action@v1.3.0
      with:
        source-dir: graph
        build-dir: graph/build
        args: -DCMAKE_BUILD_TYPE:STRING=Release
        run-build: true

    # The graphs use derived data, made by the commits module when it runs.
    - name: Generate derived data, if missing
      shell: bash
      run: |
        if [ ! -d public/data/chromium/usernames ]; then
          npm run generate-derived-data
        fi
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Create Graphs
      shell: bash
      env:
        GRAPH_FORCE: ${{ inputs.force == 'true' && '1' || '' }}
      run: |
        cd importer
        npm run graph

    - name: Deploy community map
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ./public/community-map/
        publish_branch: community-map
        force_orphan: true
