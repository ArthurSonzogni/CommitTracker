name: 'Fetch Commits'
description: 'Fetches new commits, cleans data, and pushes data'
inputs:
  github_token:
    description: 'GitHub Token'
    required: true
runs:
  using: "composite"
  steps:
    - name: Fetch new commits
      shell: bash
      run: |
        cd importer
        npm run fetch_data
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Fetch bug titles
      shell: bash
      run: |
        cd importer
        npm run fetch_bug_titles
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Cleanup derived data
      shell: bash
      run: |
        npm run clean-derived-data

    - name: Push data
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ./public/data/
        publish_branch: data
        force_orphan: true
