name: importer

on:
  workflow_dispatch:
    inputs:
      run_commits:
        description: 'Fetch Commits & Update Data'
        type: boolean
        default: true
      run_treemap:
        description: 'Generate Treemap'
        type: boolean
        default: true
      run_fuzz:
        description: 'Fetch Fuzz Data'
        type: boolean
        default: true
      run_cve:
        description: 'Fetch CVE Data'
        type: boolean
        default: true
      run_graph:
        description: 'Generate C++ Graphs'
        type: boolean
        default: true
      force_graph:
        description: 'Regenerate every graph, even the up to date ones'
        type: boolean
        default: false
      run_commit_rates:
        description: 'Generate commit rates'
        type: boolean
        default: true
      run_accretion:
        description: 'Replay the new commits for the code accretion'
        type: boolean
        default: true
  schedule:
    - cron: '0 0 * * 1,2,3,4,5'

concurrency:
  group: importer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  importer:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Run Flags
        id: config
        run: |
          # Default: Assume we do not run anything unless specified
          DO_COMMITS="false"
          DO_TREEMAP="false"
          DO_FUZZ="false"
          DO_CVE="false"
          DO_GRAPH="false"
          DO_COMMIT_RATES="false"
          DO_ACCRETION="false"

          # Logic for Scheduled Runs (Cron)
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Commits and accretion run every day
            DO_COMMITS="true"
            DO_ACCRETION="true"

            DAY_OF_WEEK=$(date +%u)

            if [[ "$DAY_OF_WEEK" == "1" ]]; then DO_TREEMAP="true"; fi
            if [[ "$DAY_OF_WEEK" == "2" ]]; then DO_FUZZ="true"; fi
            if [[ "$DAY_OF_WEEK" == "3" ]]; then DO_COMMIT_RATES="true"; fi
            if [[ "$DAY_OF_WEEK" == "4" ]]; then DO_CVE="true"; fi
            if [[ "$DAY_OF_WEEK" == "5" ]]; then DO_GRAPH="true"; fi
          fi

          # Logic for Manual Runs
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DO_COMMITS="${{ inputs.run_commits }}"
            DO_TREEMAP="${{ inputs.run_treemap }}"
            DO_FUZZ="${{ inputs.run_fuzz }}"
            DO_CVE="${{ inputs.run_cve }}"
            DO_GRAPH="${{ inputs.run_graph }}"
            DO_COMMIT_RATES="${{ inputs.run_commit_rates }}"
            DO_ACCRETION="${{ inputs.run_accretion }}"
          fi

          echo "run_commits=$DO_COMMITS" >> $GITHUB_OUTPUT
          echo "run_treemap=$DO_TREEMAP" >> $GITHUB_OUTPUT
          echo "run_fuzz=$DO_FUZZ" >> $GITHUB_OUTPUT
          echo "run_cve=$DO_CVE" >> $GITHUB_OUTPUT
          echo "run_graph=$DO_GRAPH" >> $GITHUB_OUTPUT
          echo "run_commit_rates=$DO_COMMIT_RATES" >> $GITHUB_OUTPUT
          echo "run_accretion=$DO_ACCRETION" >> $GITHUB_OUTPUT

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Pull dependencies
        run: |
          npm run pull-data
          cd importer && npm install

      # --- MODULES (Composite Actions) ---

      - name: Run Commits Module
        if: steps.config.outputs.run_commits == 'true'
        uses: ./.github/actions/commits
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Treemap Module
        if: steps.config.outputs.run_treemap == 'true'
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: treemap
          publish_dir: ./public/treemap/
          publish_branch: treemap

      - name: Run Fuzz Module
        if: steps.config.outputs.run_fuzz == 'true'
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: fuzztest
          publish_dir: ./public/fuzz-test/
          publish_branch: fuzz-test

      - name: Run CVE Module
        if: steps.config.outputs.run_cve == 'true'
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: cve
          publish_dir: ./public/cve/
          publish_branch: cve

      - name: Run Graph Module
        if: steps.config.outputs.run_graph == 'true'
        uses: ./.github/actions/graph
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force_graph == true }}

      - name: Run Commit Rates Module
        if: steps.config.outputs.run_commit_rates == 'true'
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: commit_rates
          publish_dir: ./public/commit_rates/
          publish_branch: commit_rates

      - name: Run Accretion Module
        if: steps.config.outputs.run_accretion == 'true'
        uses: ./.github/actions/accretion
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
