name: importer

on:
  workflow_dispatch:
    inputs:
      run_commits:
        description: 'Fetch Commits & Update Data'
        type: boolean
        default: true
      run_treemap:
        description: 'Generate Treemap'
        type: boolean
        default: true
      run_fuzz:
        description: 'Fetch Fuzz Data'
        type: boolean
        default: true
      run_cve:
        description: 'Fetch CVE Data'
        type: boolean
        default: true
      run_graph:
        description: 'Generate C++ Graphs'
        type: boolean
        default: true
      force_graph:
        description: 'Regenerate every graph, even the up to date ones'
        type: boolean
        default: false
      run_commit_rates:
        description: 'Generate commit rates'
        type: boolean
        default: true
      run_accretion:
        description: 'Replay the new commits for the code accretion'
        type: boolean
        default: true
  schedule:
    - cron: '0 0 * * 1,2,3,4,5'

concurrency:
  group: importer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_commits: ${{ steps.config.outputs.run_commits }}
      run_treemap: ${{ steps.config.outputs.run_treemap }}
      run_fuzz: ${{ steps.config.outputs.run_fuzz }}
      run_cve: ${{ steps.config.outputs.run_cve }}
      run_graph: ${{ steps.config.outputs.run_graph }}
      run_commit_rates: ${{ steps.config.outputs.run_commit_rates }}
      run_accretion: ${{ steps.config.outputs.run_accretion }}
    steps:
      - name: Configure Run Flags
        id: config
        run: |
          DO_COMMITS="false"
          DO_TREEMAP="false"
          DO_FUZZ="false"
          DO_CVE="false"
          DO_GRAPH="false"
          DO_COMMIT_RATES="false"
          DO_ACCRETION="false"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Commits and accretion run every weekday
            DO_COMMITS="true"
            DO_ACCRETION="true"

            DAY_OF_WEEK=$(date +%u)
            if [[ "$DAY_OF_WEEK" == "1" ]]; then DO_TREEMAP="true"; fi
            if [[ "$DAY_OF_WEEK" == "2" ]]; then DO_FUZZ="true"; fi
            if [[ "$DAY_OF_WEEK" == "3" ]]; then DO_COMMIT_RATES="true"; fi
            if [[ "$DAY_OF_WEEK" == "4" ]]; then DO_CVE="true"; fi
            if [[ "$DAY_OF_WEEK" == "5" ]]; then DO_GRAPH="true"; fi
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DO_COMMITS="${{ inputs.run_commits }}"
            DO_TREEMAP="${{ inputs.run_treemap }}"
            DO_FUZZ="${{ inputs.run_fuzz }}"
            DO_CVE="${{ inputs.run_cve }}"
            DO_GRAPH="${{ inputs.run_graph }}"
            DO_COMMIT_RATES="${{ inputs.run_commit_rates }}"
            DO_ACCRETION="${{ inputs.run_accretion }}"
          fi

          echo "run_commits=$DO_COMMITS" >> $GITHUB_OUTPUT
          echo "run_treemap=$DO_TREEMAP" >> $GITHUB_OUTPUT
          echo "run_fuzz=$DO_FUZZ" >> $GITHUB_OUTPUT
          echo "run_cve=$DO_CVE" >> $GITHUB_OUTPUT
          echo "run_graph=$DO_GRAPH" >> $GITHUB_OUTPUT
          echo "run_commit_rates=$DO_COMMIT_RATES" >> $GITHUB_OUTPUT
          echo "run_accretion=$DO_ACCRETION" >> $GITHUB_OUTPUT

  commits:
    needs: config
    if: needs.config.outputs.run_commits == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: data

      - name: Run Commits Module
        uses: ./.github/actions/commits
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  treemap:
    needs: config
    if: needs.config.outputs.run_treemap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: treemap

      - name: Run Treemap Module
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: treemap
          publish_dir: ./public/treemap/
          publish_branch: treemap

  fuzz:
    needs: config
    if: needs.config.outputs.run_fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: fuzz-test

      - name: Run Fuzz Module
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: fuzztest
          publish_dir: ./public/fuzz-test/
          publish_branch: fuzz-test

  cve:
    needs: config
    if: needs.config.outputs.run_cve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: cve

      - name: Run CVE Module
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: cve
          publish_dir: ./public/cve/
          publish_branch: cve

  commit_rates:
    needs: config
    if: needs.config.outputs.run_commit_rates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: commit_rates

      - name: Run Commit Rates Module
        uses: ./.github/actions/run-and-push
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: commit_rates
          publish_dir: ./public/commit_rates/
          publish_branch: commit_rates

  accretion:
    needs: config
    if: needs.config.outputs.run_accretion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: data accretion

      - name: Run Accretion Module
        uses: ./.github/actions/accretion
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Graph depends on the fresh data branch pushed by commits (when commits runs).
  graph:
    needs: [config, commits]
    if: ${{ always() && needs.config.outputs.run_graph == 'true' && (needs.commits.result == 'success' || needs.commits.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup importer
        uses: ./.github/actions/setup-importer
        with:
          branches: data community-map

      - name: Run Graph Module
        uses: ./.github/actions/graph
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force_graph == true }}

  summary:
    needs: [config, commits, treemap, fuzz, cve, commit_rates, accretion, graph]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write workflow summary
        run: |
          {
            echo "### Importer modules"
            echo "| Module | Result |"
            echo "| :--- | :--- |"
            echo "| commits | ${{ needs.commits.result }} |"
            echo "| treemap | ${{ needs.treemap.result }} |"
            echo "| fuzz | ${{ needs.fuzz.result }} |"
            echo "| cve | ${{ needs.cve.result }} |"
            echo "| commit_rates | ${{ needs.commit_rates.result }} |"
            echo "| accretion | ${{ needs.accretion.result }} |"
            echo "| graph | ${{ needs.graph.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
