name: cd

on:
  # Allows manual trigger.
  workflow_dispatch: {}

  # Triggered when the importer or fixmailmap workflow completes.
  workflow_run:
    workflows:
      - "importer"
      - "fixmailmap"
    types:
      - completed

  # Trigger when a new commit is pushed to the main branch.
  push:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - '.github/FUNDING.yml'
      - '.github/workflows/importer.yaml'
      - '.github/workflows/fixmailmap.yaml'
      - '.github/actions/**'
      - 'graph/**'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cd-build
      cancel-in-progress: true
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup node env
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            importer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pull data
        run: npm run pull-data

      - name: Generate derived data
        run: npm run generate-derived-data
        env:
          # Fetching files from GitHub is less throttled with a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate website
        run: npm run generate

      - name: Test website interactions
        run: npm run test:interactions

      # The commit rates pages are dormant: their ~30k data files made the
      # Pages deployment time out. The pages are still built and tested.
      - name: Drop dormant data
        run: rm -rf .output/public/commit_rates

      # Deployed as an artifact: much faster than committing the 200k files
      # of the site to a branch, and building it again.
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  # Separate job so the github-pages artifact is finalized before deploy-pages
  # queries for it, and so failed deploys can be re-run without rebuilding.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deployment at a time: a newer deploy waits instead of racing.
    concurrency:
      group: cd-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
