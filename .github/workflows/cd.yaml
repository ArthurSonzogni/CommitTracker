name: cd

on:
  # Allows manual trigger.
  workflow_dispatch: {}

  # Triggered when the importer workflow completes.
  workflow_run:
    workflows:
      - "importer"
    types:
      - completed

  # Trigger when a new commit is pushed to the main branch.
  push:
    branches:
      - main

# One deployment at a time: a newer run waits for the current one, instead of
# racing it to deploy.
concurrency:
  group: cd
  cancel-in-progress: false

# For deploying to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cd:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build website
        run: |
          npm install
          npm run pull-data
          npm run generate-derived-data
          npm run generate
        env:
          # Fetching files from GitHub is less throttled with a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test website interactions
        run: npm run test:interactions

      # Deployed as an artifact: much faster than committing the 200k files
      # of the site to a branch, and building it again.
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
