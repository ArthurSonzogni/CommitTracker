name: cd

on:
  # Allows manual trigger.
  workflow_dispatch: {}

  # Triggered when the importer or fixmailmap workflow completes.
  workflow_run:
    workflows:
      - "importer"
      - "fixmailmap"
    types:
      - completed

  # Trigger when a new commit is pushed to the main branch.
  push:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - '.github/FUNDING.yml'
      - '.github/workflows/importer.yaml'
      - '.github/workflows/fixmailmap.yaml'
      - '.github/actions/**'
      - 'graph/**'

  # Verify builds and interaction tests on pull requests.
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - '.github/FUNDING.yml'
      - '.github/workflows/importer.yaml'
      - '.github/workflows/fixmailmap.yaml'
      - '.github/actions/**'
      - 'graph/**'

permissions:
  contents: read

jobs:
  build:
    # Deploy even on partial importer failure: each importer module pushes its
    # own orphan branch atomically only on success.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cd-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
      cancel-in-progress: true
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Setup node env
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            importer/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          (cd importer && npm ci)

      - name: Lint, typecheck, and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      # Pull all data branches (including commit_rates, which scripts/derive/compact-treemap.mjs
      # folds into treemap commit-rate metrics; raw commit_rates/ is omitted from the deployed site).
      - name: Pull data
        run: npm run pull-data

      - name: Summarize data freshness
        run: |
          {
            echo "### Data branches"
            echo "| Branch | Last updated |"
            echo "| :--- | :--- |"
            node -e '
              const dates = JSON.parse(require("fs").readFileSync("public/data_updated.json", "utf8"));
              for (const [branch, date] of Object.entries(dates)) {
                console.log(`| \`${branch}\` | ${date} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate derived data
        run: npm run generate-derived-data
        env:
          SKIP_NPM_INSTALL: '1'
          # Fetching files from GitHub is less throttled with a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate website
        run: npm run generate
        env:
          MOVE_PUBLIC_DATA: '1'

      - name: Test website interactions
        if: github.event_name == 'pull_request'
        run: npm run test:interactions

      # Deployed as an artifact: much faster than committing the 200k files
      # of the site to a branch, and building it again.
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  # Separate job so the github-pages artifact is finalized before deploy-pages
  # queries for it, and so failed deploys can be re-run without rebuilding.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deployment at a time: a newer deploy waits instead of racing.
    concurrency:
      group: cd-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
