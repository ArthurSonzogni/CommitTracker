name: cd

on:
  # Allows manual trigger.
  workflow_dispatch: {}

  # Triggered when the importer workflow completes.
  workflow_run:
    workflows:
      - "importer"
    types:
      - completed

  # Trigger when a new commit is pushed to the main branch.
  push:
    branches:
      - main

# One deployment at a time: a newer run waits for the current one, instead of
# racing it to push gh-pages.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build website
        run: |
          npm install
          npm run pull-data
          # Only the importer needs the accretion state, not the site.
          rm -f public/accretion/*/state.bin.gz
          npm run generate-derived-data
          npm run generate
        env:
          # Fetching files from GitHub is less throttled with a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test website interactions
        run: npm run test:interactions

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: gh-pages
          force_orphan: true
