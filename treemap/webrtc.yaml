metrics:

# General ----------------------------------------------------------------------

- name: C++ file
  description: The number of C++ files.
  script: >-
    git ls-files -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c'
  file: file

- name: C++ line
  description: The number of lines in C++ lines, omitting blank/comment/macro.
  script: >-
    python3 ../../scripts/cpp_lines.py
  file: line

# Spanification ----------------------------------------------------------------

- name: "Unsafe Buffer Usage Lines"
  description: The number of lines with UNSAFE_BUFFER_USAGE, calculated by a script.
  script: >-
    python3 ../../scripts/warn_unsafe_buffer_usage_lines.py --repo=webrtc
  file: lines_unsafe_buffer_usage
  tags: ["Spanification"]

- name: allow_unsafe_buffers
  description: The number of files with allow_unsafe_buffers
  script: >-
    git grep -c 'allow_unsafe_buffers' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: allow_unsafe_buffers
  tags: ["Spanification"]

- name: UNSAFE_BUFFERS
  description: The occurrences of UNSAFE_BUFFERS(...)
  script: >-
    git grep -c 'UNSAFE_BUFFERS(' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: unsafe_buffers
  tags: ["Spanification"]

- name: UNSAFE_TODO
  description: The occurrences of UNSAFE_TODO(...)
  script: >-
    git grep -c 'UNSAFE_TODO(' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: unsafe_todo
  tags: ["Spanification"]

# MiraclePtr -------------------------------------------------------------------

- name: raw_ptr
  description: The number of raw_ptr<T>
  script: >-
    git grep -c 'raw_ptr<' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: raw_ptr
  tags: ["MiraclePtr"]

- name: raw_ref
  description: The number of raw_ref<T>
  script: >-
    git grep -c 'raw_ref<' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: raw_ref
  tags: ["MiraclePtr"]

- name: RAW_PTR_EXCLUSION
  description: The number of RAW_PTR_EXCLUSION
  script: >-
    git grep -c 'RAW_PTR_EXCLUSION ' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: raw_ptr_exclusion
  tags: ["MiraclePtr"]

- name: DanglingUntriaged
  description: The number of DanglingUntriaged
  script: >-
    git grep -c 'DanglingUntriaged' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: dangling_untriaged
  tags: ["MiraclePtr"]

# Checks -----------------------------------------------------------------------

- name: CHECK
  description: The number of CHECK / RTC_CHECK and its variants
  script: >-
    git grep -c -E '\b(RTC_)?CHECK(_[A-Z0-9_]+)?\(' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: check
  tags: ["Checks"]

- name: DCHECK
  description: The number of DCHECK / RTC_DCHECK and its variants
  script: >-
    git grep -c -E '\b(RTC_)?DCHECK(_[A-Z0-9_]+)?\(' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: dcheck
  tags: ["Checks"]

# Languages --------------------------------------------------------------------

- name: "Rust file"
  description: The number of Rust files.
  script: >-
    git ls-files -- '*.rs'
  file: rust_file
  tags: ["Languages"]

# Tests ----------------------------------------------------------------------

- name: "Tests"
  description: The number of tests (TEST, TEST_F, TEST_P, TYPED_TEST, IN_PROC_BROWSER_TEST_F, ...)
  script: >-
    git grep -cE '^\s*(IN_PROC_BROWSER_TEST|TYPED_TEST|TEST)(_F|_P)?\(' -- '*test*.cc' '*test*.cpp' '*test*.mm'
  file: tests
  tags: ["Tests"]

- name: "Disabled tests"
  description: The lines with DISABLED_ in test files, for tests disabled everywhere, or on some platforms with MAYBE_
  script: >-
    git grep -cE '\bDISABLED_' -- '*test*.cc' '*test*.cpp' '*test*.mm'
  file: disabled_tests
  tags: ["Tests"]

# Memory Safety --------------------------------------------------------------

- name: "reinterpret_cast"
  description: The occurrences of reinterpret_cast.
  script: >-
    git grep -c 'reinterpret_cast<' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: reinterpret_cast
  tags: ["Memory Safety"]

- name: "Unsafe libc calls"
  description: The calls to memcpy, memmove, memset, memcmp, strcpy, strncpy, strcat, strlen and sprintf.
  script: >-
    git grep -cE '\b(memcpy|memmove|memset|memcmp|strcpy|strncpy|strcat|strlen|sprintf)\(' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c' ':!tools/*'
  file: unsafe_libc
  tags: ["Spanification"]

# Misc -------------------------------------------------------------------------

- name: TODO
  description: The number of TODO
  script: >-
    git grep -c 'TODO' -- '*.h' '*.hpp' '*.cc' '*.cpp' '*.c'
  file: todo
  tags: ["Misc"]
